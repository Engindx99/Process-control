hardware:
  num_cpu: 11
  device: "auto"

mpc:
  setpoint: 1450.0
  prediction_horizon: 40    # 80'den 40'a çektik. 100 kütle için bu mesafe yeterli.
  control_horizon: 3        
  weights:
    mse: 1.0                
    smoothness: 2500.0      # 8000 çok fazlaydı, 2500'e çekerek MPC'ye hareket alanı verdik.
    o2_tracking: 50.0       
    energy: 0.5           

rl:
  total_timesteps: 150000  
  learning_rate: 1e-5    
  n_steps: 4096             # Gecikmeyi ve hantallığı kavraması için artırdık
  batch_size: 512
  gamma: 0.995              # Uzun vadeli kararlılık odağı
  action_limit: 0.18      

paths:
  model_save_path: "models/ppo_kiln_v5_final"
  log_path: "logs/training_stats.csv"