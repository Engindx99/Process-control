# =================================================================
# ROTARY KILN: GÜRÜLTÜYE DAYANIKLI (ROBUST) MPC KONFİGÜRASYONU
# =================================================================

mpc:
  prediction_horizon: 50  # Gürültüyü sönümlemek için daha uzak geleceğe bakıyoruz
  control_horizon: 5      # Kontrol hamlelerini daha planlı yapıyoruz
  setpoint: 1450.0        
  
  weights:
    mse: 1.5              # Hedefe bağlılık (Hafif artırıldı)
    smoothness: 1200.0    # ÇOK KRİTİK: Gürültüyü takip etmemesi için yakıtı ağırlaştırıyoruz
    o2_tracking: 10.0     
    energy: 0.01          # Ofset (sapma) oluşmaması için yakıt cezasını düşürdük

paths:
  results_csv: "data/pure_mpc_results.csv"

simulation:
  total_steps: 5000
  initial_temp: 1400.0
  filter_window: 5        # Sıcaklık verisini yumuşatmak için kullanılacak pencere