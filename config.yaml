# Hardware & Device Settings
hardware:
  num_cpu: 11
  device: "cuda"

# Operational Targets
system:
  setpoint: 1450.0
  step_duration_sec: 5  # Analizlerde kullandığımız 5s ölçeği

# MPC (Model Predictive Control) Settings
mpc:
  prediction_horizon: 120      # Uzun bakış (iyi, aynı kalıyor)
  control_horizon: 20          # Daha fazla aksiyon kapasitesi

  maxiter: 20                  # Biraz artır → daha iyi optimizasyon

  weights:
    mse: 5.0                   # Hedefe daha sıkı yapışma
    smoothness: 100            # Aşırı kısıtlamayı kaldırdık
    o2_tracking: 3.0           # Aynı bırak (iyi çalışıyor)
    energy: 0.5                # Yakıt dalgalanmasını cezalandır            # Yakıt tasarrufu baskısı (Hafif)

# RL (Reinforcement Learning - PPO) Settings
rl:
  total_timesteps: 100000    
  learning_rate: 3.0e-5      # Dengeli öğrenme hızı (v11 tatlı nokta)
  n_steps: 4096              # Her güncelleme arası adım sayısı
  batch_size: 512            # Mini-batch boyutu
  gamma: 0.98                # Gelecek ödüllerin indirim oranı
  action_limit: 0.17         # Yakıt değişimindeki %17'lik esneklik payı

# Observation Space Normalization
observation:
  temp_scale: 100.0
  o2_scale: 2.0
  fuel_scale: 5.0

# Reward Function Weights
reward:
  temp_deadband: 0.2         # ±0.2 derece içindeyken ceza kesme
  big_error_scale: 2.0       # Büyük sapmalara karşı direnç
  small_error_scale: 5.8     # İnce ayar hassasiyeti
  jitter_penalty: 60.0       # Sarı yakıt hattındaki titremeye ağır ceza
  smooth_scale: 15.0         # Ani vana hareketlerine kareli ceza
  bonus_small: 10.0          # Hedefte kalma (success) ödülü
  energy_scale: 0.01         # Tasarruf önceliği (En düşük)

# Physical Plant Limits
plant:
  temp_min: 1200.0
  temp_max: 1700.0

# File Paths & Logging
paths:
  model_save_path: "models/ppo_kiln_v11_agile.zip"
  log_path: "logs/training_stats_v11.csv"