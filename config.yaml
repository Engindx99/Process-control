# Physical Plant & Operational Limits
limits:
  temp_min: 1200.0
  temp_max: 1700.0
  fuel_min: 12.0
  fuel_max: 28.0    # Merdivenleri tırmanmak için gereken güç
  fan_min: 850.0
  fan_max: 1100.0

hardware:
  num_cpu: 11
  device: "auto" # "cpu" veya "cuda"

# Operational Targets
system:
  setpoint: 1450.0
  step_duration_sec: 5

# MPC Settings
mpc:
  prediction_horizon: 120
  control_horizon: 10   # 20'den 10'a: %50 hız artışı sağlar
  maxiter: 12            # 20'den 12'ye: Optimizasyon döngüsünü hızlandırır
  weights:
    mse: 2.0
    smoothness: 1000.0    # Biraz daha artırarak yakıtı iyice sönümledik
    o2_tracking: 3.0
    energy: 1.5

# Reward Function Weights (RL Training)
reward:
  temp_deadband: 0.2
  big_error_scale: 2.0
  small_error_scale: 5.8
  jitter_penalty: 60.0  # Yakıt titremesini durdurur
  smooth_scale: 15.0
  bonus_small: 10.0
  energy_scale: 0.01