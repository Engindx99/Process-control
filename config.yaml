# Physical Plant & Operational Limits
plant: 
  temp_min: 1200.0
  temp_max: 1700.0
  fuel_min: 12.0
  fuel_max: 28.0
  fan_min: 850.0
  fan_max: 1100.0

hardware:
  num_cpu: 11
  device: "auto"

# Operational Targets
system:
  setpoint: 1450.0
  step_duration_sec: 5

# MPC Settings
mpc:
  prediction_horizon: 120
  control_horizon: 10
  maxiter: 12
  weights:
    mse: 2.0
    smoothness: 1000.0
    o2_tracking: 3.0
    energy: 1.5

observation:
  temp_scale: 100.0   
  o2_scale: 5.0        
  fuel_scale: 20.0     


rl:
  action_limit: 0.16
  fan_action_limit: 10.0
  learning_rate: 0.0003
  n_steps: 2048
  total_timesteps: 100000

reward:
  error_penalty_scale: 15.0
  smoothness_weight: 20.0
  efficiency_weight: 3.0
  termination_penalty: 1000.0


paths:
  model_save_path: "models/ppo_rotary_kiln_residual"
  log_path: "logs/"