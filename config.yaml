hardware:
  num_cpu: 11
  device: "auto"


system:
  setpoint: 1450.0


mpc:
  prediction_horizon: 80
  control_horizon: 3

  weights:
    mse: 0.2
    smoothness: 20000.0
    o2_tracking: 50.0
    energy: 0.5


rl:
  total_timesteps: 100000
  learning_rate: 5e-6
  n_steps: 4096
  batch_size: 512
  gamma: 0.995
  action_limit: 0.05


observation:
  temp_scale: 50.0
  o2_scale: 2.0
  fuel_scale: 5.0


reward:
  temp_deadband: 10.0
  big_error_scale: 0.005
  small_error_scale: 0.05

  damping_scale: 3.0    
  smooth_scale: 15.0    
  energy_scale: 0.02

  bonus_small: 1.0
  bonus_critical: 2.0


plant:
  temp_min: 1200.0
  temp_max: 1700.0


paths:
  model_save_path: "models/ppo_kiln_v5_final"
  log_path: "logs/training_stats.csv"